<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plateia AI</title>
<style>
  html,body{height:100%;margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial}
  .wrap{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:32px;box-sizing:border-box;background:#f7f7f7}
  p{max-width:800px;color:#111;margin:0 0 32px;text-align:center;line-height:1.6}
  canvas{background:white;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,0.08)}
</style>
</head>
<body>
<div class="wrap">
<p>Plateia AI is a Grassroots initiative demystifying AI and initiating open dialogues about its social and environmental impact.</p>
<canvas id="c" width="420" height="420" aria-hidden="true"></canvas>
</div>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let size=120;
let x=(canvas.width-size)/2,y=(canvas.height-size)/2;
let dragging=false,offsetX=0,offsetY=0;

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,0.15)';
  ctx.shadowBlur=12;
  ctx.fillStyle=dragging ? '#1f6feb' : '#0ea5a4';
  ctx.fillRect(x,y,size,size);
  ctx.restore();
}
draw();

function inside(mx,my){ return mx>=x && mx<=x+size && my>=y && my<=y+size; }

function getPoint(e){
  const rect=canvas.getBoundingClientRect();
  if(e.touches && e.touches[0]) return {mx: e.touches[0].clientX-rect.left, my: e.touches[0].clientY-rect.top};
  return {mx: e.clientX-rect.left, my: e.clientY-rect.top};
}

function onPointerDown(e){
  const {mx,my} = getPoint(e);
  if(inside(mx,my)){
    dragging=true;
    offsetX=mx-x; offsetY=my-y;
    e.preventDefault();
    draw();
  }
}
function onPointerMove(e){
  if(!dragging) return;
  const {mx,my} = getPoint(e);
  x = Math.max(0, Math.min(canvas.width-size, mx - offsetX));
  y = Math.max(0, Math.min(canvas.height-size, my - offsetY));
  draw();
}
function onPointerUp(e){
  if(dragging){
    dragging=false;
    draw();
  }
}

canvas.addEventListener('mousedown',onPointerDown);
canvas.addEventListener('touchstart',onPointerDown,{passive:false});
window.addEventListener('mousemove',onPointerMove);
window.addEventListener('touchmove',function(e){ if(dragging){ e.preventDefault(); onPointerMove(e); } },{passive:false});
window.addEventListener('mouseup',onPointerUp);
window.addEventListener('touchend',onPointerUp);

canvas.addEventListener('dblclick',()=>{ x=(canvas.width-size)/2;y=(canvas.height-size)/2;draw(); });
</script>
</body>
</html>
