<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plateia AI</title>
<style>
  html,body{height:100%;margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial}
  .wrap{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:32px;box-sizing:border-box;background:#f7f7f7}
  .logo{width:300px;margin-bottom:24px}
  .footer{margin-top:24px;display:flex;flex-direction:column;align-items:center;gap:8px}
  .icons{display:flex;gap:16px}
  .icons img{width:36px;height:36px;filter:grayscale(100%);transition:filter .18s ease}
  .icons a:hover img{filter:none}
  .contact{color:#444;font-size:14px}
  a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="images/logo_with_text_transparent.png" alt="Plateia AI logo">
  <p>Plateia AI is a grassroots initiative demystifying AI and initiating open dialogues about its social and environmental impact.</p>
  <p><i>New site coming soon!</p>

  <footer class="footer" role="contentinfo">
    <div class="icons">
      <a href="https://www.instagram.com/plateiaai/" target="_blank" rel="noopener noreferrer" aria-label="Plateia AI on Instagram">
        <img src="images/instagram.png" alt="Instagram">
      </a>
      <a href="https://www.linkedin.com/company/plateia-ai-gr/" target="_blank" rel="noopener noreferrer" aria-label="Plateia AI on LinkedIn">
        <img src="images/linkedin.png" alt="LinkedIn">
      </a>
    </div>
    <div class="contact">contact: <a href="mailto:info@plateia-ai.gr">info@plateia-ai.gr</a></div>
  </footer>
</div>

</body>
</html>
